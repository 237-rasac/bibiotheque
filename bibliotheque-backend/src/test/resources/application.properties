# ============================================================
# Configuration des tests : base H2 en memoire
# Aucune base de donnees externe n'est requise pour mvn test.
# ============================================================

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Le seed data.sql (PostgreSQL) n'est pas execute pendant les tests :
# les données de test sont creees par les classes de test elles-memes.
spring.sql.init.mode=never

# SpringDoc OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
