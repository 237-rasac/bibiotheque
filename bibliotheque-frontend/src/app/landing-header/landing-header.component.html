<!-- ============================================================ -->
<!-- LANDING PAGE HEADER (public / marketing)                      -->
<!-- Entirely separate from the authenticated app header.          -->
<!-- ============================================================ -->
<header class="lp-header" [class.lp-header--scrolled]="isScrolled">
  <div class="lp-header-inner">
    <!-- Brand -->
    <a class="lp-header-brand" (click)="goToSection('lp-hero-anchor')" href="javascript:void(0)">
      <span class="lp-header-logo"><i class="fa-solid fa-book-open"></i></span>
      <span class="lp-header-name">{{ brandName }}</span>
    </a>

    <!-- Desktop anchor navigation -->
    <nav class="lp-header-nav" aria-label="Landing navigation">
      <button
        *ngFor="let link of navLinks"
        type="button"
        class="lp-header-link"
        (click)="goToSection(link.target)">
        {{ link.label }}
      </button>
    </nav>

    <!-- Actions -->
    <div class="lp-header-actions">
      <button
        type="button"
        class="lp-header-icon-btn"
        (click)="toggleTheme()"
        [attr.aria-label]="isDark ? 'Switch to light mode' : 'Switch to dark mode'"
        [title]="isDark ? 'Switch to light mode' : 'Switch to dark mode'">
        <i class="fa-solid" [class.fa-moon]="!isDark" [class.fa-sun]="isDark"></i>
      </button>

      <ng-container *ngIf="isLoggedIn(); else loggedOut">
        <a class="lp-header-cta" routerLink="/books">
          <i class="fa-solid fa-table-columns"></i> My space
        </a>
      </ng-container>
      <ng-template #loggedOut>
        <a class="lp-header-login" routerLink="/login">Sign in</a>
        <a class="lp-header-cta" routerLink="/login">
          <i class="fa-solid fa-rocket"></i> Get started
        </a>
      </ng-template>

      <!-- Mobile burger -->
      <button
        type="button"
        class="lp-header-burger"
        (click)="toggleMenu()"
        [attr.aria-label]="isMenuOpen ? 'Close menu' : 'Open menu'"
        [attr.aria-expanded]="isMenuOpen">
        <i class="fa-solid" [class.fa-bars]="!isMenuOpen" [class.fa-xmark]="isMenuOpen"></i>
      </button>
    </div>
  </div>

  <!-- Mobile dropdown menu -->
  <div class="lp-header-mobile" [class.lp-header-mobile--open]="isMenuOpen">
    <button
      *ngFor="let link of navLinks"
      type="button"
      class="lp-header-mobile-link"
      (click)="goToSection(link.target)">
      {{ link.label }}
    </button>
    <ng-container *ngIf="isLoggedIn(); else loggedOutMobile">
      <a class="lp-header-mobile-cta" routerLink="/books" (click)="closeMenu()">
        <i class="fa-solid fa-table-columns"></i> My space
      </a>
    </ng-container>
    <ng-template #loggedOutMobile>
      <a class="lp-header-mobile-link" routerLink="/login" (click)="closeMenu()">Sign in</a>
      <a class="lp-header-mobile-cta" routerLink="/login" (click)="closeMenu()">
        <i class="fa-solid fa-rocket"></i> Get started
      </a>
    </ng-template>
  </div>
</header>
