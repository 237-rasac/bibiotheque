<div class="form-wrapper">
  <div class="ds-card ds-animate-scaleIn">
    <div class="ds-card-header">
      <h4 style="margin: 0;"><i class="fa-solid fa-user-plus" style="margin-right: 0.5rem; color: var(--ds-primary);"></i> Add User</h4>
    </div>
    <div class="ds-card-body">
      <form (ngSubmit)="onSubmit()" autocomplete="off">
        <div class="ds-form-group">
          <label class="ds-label">Name</label>
          <input type="text" class="ds-input" id="name" [(ngModel)]="user.name" name="name" placeholder="Enter full name">
        </div>
        <div class="ds-form-group">
          <label class="ds-label">Username</label>
          <input type="text" class="ds-input" id="username" [(ngModel)]="user.username" name="username" placeholder="Enter username">
        </div>
        <div class="ds-form-group">
          <label class="ds-label">Password</label>
          <input type="password" class="ds-input" id="password" [(ngModel)]="user.password" name="password" placeholder="Enter password">
        </div>
        <div class="ds-form-group">
          <label class="ds-label">Role</label>
          <select class="ds-select" id="role" [(ngModel)]="user.role[0].roleName" name="role">
          <option value="ADHERENT">Adhérent</option>
          <option value="BIBLIOTHECAIRE">Bibliothécaire</option>
          </select>
        </div>
        <button class="ds-btn ds-btn-success" type="submit">
          <i class="fa-solid fa-check"></i> Create User
        </button>
      </form>
    </div>
  </div>
</div>
