<div class="ds-mb-4 ds-animate-fadeIn" style="display: flex; justify-content: space-between; align-items: center;">
  <h2 style="margin: 0;"><i class="fa-solid fa-calendar-check" style="color: var(--ds-accent); margin-right: 0.5rem;"></i> Mes réservations</h2>
  <button class="ds-btn ds-btn-ghost ds-btn-sm" (click)="onRetry()" [disabled]="loading">
    <i class="fa-solid fa-rotate" [class.fa-spin]="loading"></i> Refresh
  </button>
</div>

<app-reservation-list
  [reservations]="reservations"
  [loading]="loading"
  [error]="error"
  [selectedStatut]="selectedStatut"
  [cancelling]="cancelling"
  (statutChange)="onStatutChange($event)"
  (cancel)="onAnnuler($event)"
  (retry)="onRetry()">
</app-reservation-list>
