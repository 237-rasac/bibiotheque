<div class="modal-overlay" *ngIf="show" (click)="onOverlayClick()">
  <div class="modal-container ds-animate-scaleIn" (click)="onContainerClick($event)">
    <div class="modal-header">
      <div [class]="iconBgClass">
        <i [class]="iconClass"></i>
      </div>
      <h3>{{ title }}</h3>
    </div>
    <div class="modal-body">
      <p>{{ message }}</p>
      <div class="modal-details" *ngIf="details.length > 0">
        <span *ngFor="let detail of details">
          <strong>{{ detail.label }}:</strong> {{ detail.value }}
        </span>
      </div>
      <p class="modal-warning" *ngIf="warning">{{ warning }}</p>
    </div>
    <div class="modal-footer">
      <button
        class="ds-btn ds-btn-ghost ds-btn-sm"
        (click)="onCancel()"
        [disabled]="loading">
        {{ cancelText }}
      </button>
      <button
        [class]="confirmBtnClass"
        (click)="onConfirm()"
        [disabled]="loading">
        <i class="fa-solid" [class]="loading ? loadingIconClass : confirmIconClass"></i>
        {{ loading ? loadingText : confirmText }}
      </button>
    </div>
  </div>
</div>
