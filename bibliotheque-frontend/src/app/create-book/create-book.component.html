<div class="form-wrapper">
  <div class="ds-card ds-animate-scaleIn">
    <div class="ds-card-header">
      <h4 style="margin: 0;"><i class="fa-solid fa-book-circle-plus" style="margin-right: 0.5rem; color: var(--ds-success);"></i> Add Book</h4>
    </div>
    <div class="ds-card-body">
      <form (ngSubmit)="onSubmit()" autocomplete="off">
        <div class="ds-form-group">
          <label class="ds-label">Book Name</label>
          <input type="text" class="ds-input" id="bookName" [(ngModel)]="book.bookName" name="bookName" placeholder="Enter book title">
        </div>
        <div class="ds-form-group">
          <label class="ds-label">Author</label>
          <input type="text" class="ds-input" id="bookAuthor" [(ngModel)]="book.bookAuthor" name="bookAuthor" placeholder="Enter author name">
        </div>
        <div class="ds-form-group">
          <label class="ds-label">Genre</label>
          <input type="text" class="ds-input" id="bookGenre" [(ngModel)]="book.bookGenre" name="bookGenre" placeholder="Enter genre">
        </div>
        <div class="ds-form-group">
          <label class="ds-label">Number of Copies</label>
          <input type="number" class="ds-input" id="noOfCopies" [(ngModel)]="book.noOfCopies" name="noOfCopies" placeholder="0">
        </div>
        <button class="ds-btn ds-btn-success" type="submit">
          <i class="fa-solid fa-check"></i> Create Book
        </button>
      </form>
    </div>
  </div>
</div>
