<div class="ds-mb-6 ds-animate-slideDown page-header">
  <a routerLink="/users" class="ds-btn ds-btn-ghost ds-btn-sm" style="margin-bottom: 0.75rem; display: inline-flex;">
    <i class="fa-solid fa-arrow-left"></i> Back to Users
  </a>
  <h2><i class="fa-solid fa-clock-rotate-left" style="color: var(--ds-info); margin-right: 0.5rem;"></i> Borrow History: {{ user.name }}</h2>
</div>

<div class="ds-table-wrapper ds-animate-slideUp">
  <table class="ds-table">
    <thead>
      <tr>
        <th>Book ID</th>
        <th>Issue Date</th>
        <th>Return Date</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let borrower of borrow">
        <td data-label="Book ID">{{ borrower.bookId }}</td>
        <td data-label="Issue Date">{{ borrower.issueDate }}</td>
        <td data-label="Return Date">
          <span *ngIf="borrower.returnDate != null">{{ borrower.returnDate }}</span>
          <span *ngIf="borrower.returnDate === null" class="ds-badge ds-badge-warning">
            <i class="fa-solid fa-clock"></i> Not returned
          </span>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<div *ngIf="!borrow || borrow.length === 0" class="ds-empty-state ds-mt-6 ds-animate-fadeIn">
  <div class="ds-empty-state-icon"><i class="fa-solid fa-inbox"></i></div>
  <div class="ds-empty-state-title">No borrow history</div>
  <div class="ds-empty-state-text">This user has not borrowed any books yet.</div>
</div>
